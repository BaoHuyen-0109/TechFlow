name: Build and deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Isolated Flask tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate production Compose configurations
        run: |
          docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet
          docker compose --env-file .env.production.example -f docker-compose.prod.yml -f docker-compose.bootstrap.yml config --quiet
      - name: Run tests in the isolated Docker runner
        run: docker compose -f docker-compose.test.yml run --build --rm tests
  deploy:
    # Enable only after AWS resources, DNS, HTTPS, and GitHub variables are ready.
    if: vars.AWS_DEPLOY_ENABLED == 'true'
    needs: tests
    environment: production
    concurrency:
      group: techflow-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials from protected GitHub secrets
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and publish immutable image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --pull -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "APP_IMAGE=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_ENV"
      - name: Upload deployment configuration bundle
        env:
          RELEASE: ${{ github.sha }}
        run: |
          aws s3 cp docker-compose.prod.yml "s3://$DEPLOY_BUCKET/releases/$RELEASE/docker-compose.prod.yml"
          aws s3 cp nginx/prod.conf "s3://$DEPLOY_BUCKET/releases/$RELEASE/nginx/prod.conf"
      - name: Deploy on EC2 through Systems Manager
        env:
          RELEASE: ${{ github.sha }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        shell: bash
        run: |
          set -euo pipefail
          deploy_script=$(cat <<EOF
          set -euo pipefail
          export AWS_DEFAULT_REGION="$AWS_REGION"
          install -d -m 0750 /opt/techflow/nginx
          aws s3 cp "s3://$DEPLOY_BUCKET/releases/$RELEASE/docker-compose.prod.yml" /opt/techflow/docker-compose.prod.yml
          aws s3 cp "s3://$DEPLOY_BUCKET/releases/$RELEASE/nginx/prod.conf" /opt/techflow/nginx/prod.conf
          cd /opt/techflow
          export APP_IMAGE="$APP_IMAGE"
          registry="$REGISTRY"
          aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$registry"
          docker compose --env-file /etc/techflow/app.env -f docker-compose.prod.yml pull web
          docker logout "$registry"
          docker compose --env-file /etc/techflow/app.env -f docker-compose.prod.yml run --rm web flask --app wsgi db upgrade
          docker compose --env-file /etc/techflow/app.env -f docker-compose.prod.yml up -d --remove-orphans
          for attempt in $(seq 1 60); do
            if curl --insecure --fail --silent --show-error https://localhost/health; then
              exit 0
            fi
            sleep 5
          done
          echo "Application health check did not succeed after deployment."
          exit 1
          EOF
          )
          parameters=$(jq -n --arg command "$deploy_script" '{commands: [$command]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "TechFlow deploy $RELEASE" \
            --parameters "$parameters" \
            --query 'Command.CommandId' --output text)
          for attempt in $(seq 1 180); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
                  --query StatusDetails --output text
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for the EC2 deployment command."
          exit 1
