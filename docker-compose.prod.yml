name: techflow
services:
  web:
    image: ${APP_IMAGE:?Set APP_IMAGE to an ECR image}
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the production env file}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in the production env file}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in the production env file}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the production env file}
      DB_HOST: ${DB_HOST:?Set DB_HOST to the private RDS endpoint}
      DB_PORT: ${DB_PORT:-3306}
      SESSION_COOKIE_SECURE: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      UPLOAD_STORAGE: ${UPLOAD_STORAGE:-s3}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
    expose:
      - "8000"
    networks: [application]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
  nginx:
    image: nginx:1.28.0-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    networks: [application]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 3
  certbot:
    image: certbot/certbot:v4.2.0
    profiles: [certbot]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
volumes:
  letsencrypt:
  certbot_webroot:
networks:
  application:
