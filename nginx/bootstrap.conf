# Temporary HTTP-only config used solely to complete the first ACME challenge.
# It intentionally does not expose login or business pages before HTTPS exists.
server {
    listen 80;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location = /health {
        access_log off;
        return 200 "ok\n";
    }
    location / {
        return 503;
    }
}
