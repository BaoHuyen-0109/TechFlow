# Omit query strings/referrers; customer lookup may contain contact information.
log_format techflow_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

map $request_method $login_limit_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $login_limit_key zone=login_attempts:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    access_log /var/log/nginx/access.log techflow_safe;
    listen 443 ssl;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;

    ssl_certificate /etc/letsencrypt/live/techflow/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/techflow/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /login {
        limit_req zone=login_attempts burst=5 nodelay;
        limit_req_status 429;
        error_page 429 =429 /auth/rate-limit;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
}
